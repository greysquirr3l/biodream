name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Prevent sccache or similar wrappers from interfering with rustc diagnostics.
  RUSTC_WRAPPER: ""

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Build with all features (excluding hdf5 which needs a system library).
      - name: Build (all features except hdf5)
        run: >
          cargo build --workspace
          --features "read,write,csv,arrow,parquet,serde,plot"

      # Build the no_std path — only domain + error + parser stubs, no I/O.
      - name: Build (no-default-features, no_std path)
        run: cargo build --workspace --no-default-features

      # Run the full test suite with all CI-testable features.
      - name: Test (all features except hdf5)
        run: >
          cargo test --workspace
          --features "read,write,csv,arrow,parquet,serde,plot"

      # Full lint profile from AGENTS.md.
      - name: Lint
        run: >
          cargo clippy --workspace --all-targets
          --features "read,write,csv,arrow,parquet,serde,plot"
          --
          -W clippy::all
          -W clippy::pedantic
          -W clippy::nursery
          -W clippy::cargo
          -W clippy::perf
          -A clippy::module_name_repetitions
          -A clippy::must_use_candidate
          -A clippy::missing_errors_doc
          -A clippy::missing_panics_doc
          -A clippy::struct_excessive_bools
          -A clippy::multiple_crate_versions
          -D clippy::unwrap_used
          -D clippy::expect_used
          -D clippy::panic
          -D clippy::indexing_slicing
          -D clippy::cast_ptr_alignment
          -D clippy::suspicious
          -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: >
          cargo doc --workspace --no-deps
          --features "read,write,csv,arrow,parquet,serde,plot"
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    name: MSRV (1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (1.95.0)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: >
          cargo check --workspace
          --features "read,write,csv,arrow,parquet,serde,plot"
