[graph]
# Check all targets, not just the host platform.
targets = []

[advisories]
# Known security advisories to ignore (RUSTSEC IDs go here).
ignore = [
    # paste 1.x is unmaintained (archived by dtolnay); pulled in directly by
    # parquet 58.x. No patched version exists and the dep is not actionable
    # until the Apache Arrow project removes it.
    { id = "RUSTSEC-2024-0436", reason = "transitive via parquet; no patched version available" },
    # instant 0.1.x is unmaintained; pulled transitively by hdf5 0.8.x via
    # parking_lot. No safe upgrade path is currently available in hdf5's
    # dependency graph.
    { id = "RUSTSEC-2024-0384", reason = "transitive via hdf5/parking_lot; no patched version available" },
]

[licenses]
# Allowlist of licenses. SPDX identifiers.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
]
# Copyleft licenses are not acceptable in this project.
# Unlicensed crates are rejected.
confidence-threshold = 0.8

[bans]
# Warn on duplicate versions of the same crate (some duplication is tolerated
# in large dependency trees like arrow/parquet).
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
